[project]
name = "ai-meeting-agent-backend"
version = "0.1.0"
description = "Backend for the AI Meeting Agent"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.20.0",
  "fastapi>=0.115",
  "psycopg[binary]>=3.3.6",
  "pydantic-settings>=2.16.0",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.1.5",
  "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "pytest>=8.3",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"
